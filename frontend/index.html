<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#028940" />
    <meta name="description" content="FarmersHaus — Everyday Fruits and Veggies, a healthy happy life." />
    <link rel="icon" type="image/png" href="/brand/farmershaus-logo.png" />

    <!-- Preconnect for Google Fonts (keeps existing font loading, unchanged) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Load fonts with display=swap to unblock rendering -->
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet" />

    <!-- Preload hero poster for immediate render on first visit -->
    <link rel="preload" as="image" href="/videos/farm-to-basket-poster.webp" type="image/webp" />

    <!-- Preload the hero tote image so Food Baskets page renders without flash -->
    <link rel="preload" as="image" href="/brand/farmershaus-produce-tote.webp" type="image/webp" />

    <!-- DNS-prefetch for backend API so first API call is faster -->
    <link rel="dns-prefetch" href="https://farmershausorg-backend.onrender.com" />

    <title>FarmersHaus</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
