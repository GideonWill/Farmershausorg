[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "farmershaus-api"
version = "0.1.0"
description = "FarmersHaus Django REST API"
requires-python = ">=3.12,<3.15"
dependencies = [
  "Django>=5.2,<6.0",
  "djangorestframework>=3.16,<3.18",
  "djangorestframework-simplejwt>=5.5,<6",
  "drf-spectacular>=0.28,<1",
  "django-cors-headers>=4.7,<5",
  "python-dotenv>=1.1,<2",
  "psycopg[binary]>=3.2,<4",
  "celery[redis]>=5.5,<6",
  "reportlab>=4.2,<5",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["config*", "apps*"]
